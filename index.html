<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CS2 Lineups</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans pb-12 select-none">

  <!-- TOP BAR -->
  <header class="sticky top-0 z-30 bg-zinc-900/90 backdrop-blur border-b border-zinc-800 px-4 py-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-amber-500 font-black tracking-wider text-lg">CS2</span>
        <span class="text-xs uppercase tracking-widest text-zinc-400 font-semibold">Lineups</span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openAddModal()" class="text-xs bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold px-3 py-1.5 rounded-lg flex items-center gap-1 transition shadow">
          <i class="fa-solid fa-plus"></i> Ajouter
        </button>
      </div>
    </div>

    <!-- SÉLECTEUR DE MAP -->
    <div class="flex gap-2 mt-3 overflow-x-auto no-scrollbar pb-1 text-sm font-semibold" id="mapButtons">
      <!-- Rempli en JS -->
    </div>
  </header>

  <!-- FILTRES RAPIDES : CAMP & TYPE -->
  <section class="p-4 space-y-3">
    <div class="grid grid-cols-3 gap-2 text-xs font-bold uppercase tracking-wider">
      <button onclick="setSide('ALL')" id="btn-side-ALL" class="py-2 rounded-lg bg-amber-500 text-zinc-950 transition">Tous</button>
      <button onclick="setSide('T')" id="btn-side-T" class="py-2 rounded-lg bg-zinc-900 text-amber-400 border border-zinc-800 transition">T Side</button>
      <button onclick="setSide('CT')" id="btn-side-CT" class="py-2 rounded-lg bg-zinc-900 text-sky-400 border border-zinc-800 transition">CT Side</button>
    </div>

    <div class="flex gap-2 overflow-x-auto no-scrollbar text-xs">
      <button onclick="setType('ALL')" id="btn-type-ALL" class="px-3 py-1.5 rounded-full bg-zinc-100 text-zinc-950 font-semibold whitespace-nowrap">Toutes</button>
      <button onclick="setType('smoke')" id="btn-type-smoke" class="px-3 py-1.5 rounded-full bg-zinc-900 text-zinc-400 border border-zinc-800 whitespace-nowrap"><i class="fa-solid fa-smog mr-1"></i> Smokes</button>
      <button onclick="setType('molotov')" id="btn-type-molotov" class="px-3 py-1.5 rounded-full bg-zinc-900 text-zinc-400 border border-zinc-800 whitespace-nowrap"><i class="fa-solid fa-fire mr-1"></i> Molotovs</button>
      <button onclick="setType('flash')" id="btn-type-flash" class="px-3 py-1.5 rounded-full bg-zinc-900 text-zinc-400 border border-zinc-800 whitespace-nowrap"><i class="fa-solid fa-bolt mr-1"></i> Flashs</button>
    </div>
  </section>

  <!-- LISTE DES LINEUPS -->
  <main class="px-4 space-y-4" id="lineupsList">
    <!-- Rempli en JS -->
  </main>

  <!-- MODAL 1 : FORMULAIRE D'AJOUT -->
  <div id="addModal" class="fixed inset-0 z-40 bg-black/80 backdrop-blur-sm p-4 overflow-y-auto hidden">
    <div class="max-w-lg mx-auto bg-zinc-900 border border-zinc-800 rounded-2xl p-5 shadow-2xl">
      <div class="flex justify-between items-center mb-4 border-b border-zinc-800 pb-3">
        <h2 class="text-base font-bold text-zinc-100"><i class="fa-solid fa-crosshairs text-amber-500 mr-2"></i>Nouveau Lineup</h2>
        <button onclick="closeAddModal()" class="text-zinc-500 hover:text-zinc-300 text-xl font-bold">&times;</button>
      </div>

      <form id="lineupForm" onsubmit="handleFormSubmit(event)" class="space-y-3.5 text-xs">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-zinc-400 mb-1 font-semibold">Carte</label>
            <select id="formMap" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:outline-none focus:border-amber-500">
              <option value="Mirage">Mirage</option>
              <option value="Inferno">Inferno</option>
              <option value="Nuke">Nuke</option>
              <option value="Dust II">Dust II</option>
              <option value="Ancient">Ancient</option>
              <option value="Anubis">Anubis</option>
            </select>
          </div>
          <div>
            <label class="block text-zinc-400 mb-1 font-semibold">Camp</label>
            <select id="formSide" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:outline-none focus:border-amber-500">
              <option value="T">T (Terroristes)</option>
              <option value="CT">CT (Anti-Terroristes)</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-zinc-400 mb-1 font-semibold">Grenade</label>
            <select id="formType" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:outline-none focus:border-amber-500">
              <option value="smoke">Smoke</option>
              <option value="molotov">Molotov</option>
              <option value="flash">Flash</option>
              <option value="he">HE (Grenade)</option>
            </select>
          </div>
          <div>
            <label class="block text-zinc-400 mb-1 font-semibold">Type de Clic</label>
            <select id="formClick" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:outline-none focus:border-amber-500">
              <option value="Clic Gauche">Clic Gauche</option>
              <option value="Clic Droit">Clic Droit</option>
              <option value="Clic G + D (Moyen)">Clic Gauche + Droit</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-zinc-400 mb-1 font-semibold">Mouvement au lancer</label>
          <select id="formMovement" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:outline-none focus:border-amber-500">
            <option value="Statique">Statique (Pas de saut)</option>
            <option value="Jumpthrow">Jumpthrow</option>
            <option value="W + Jumpthrow">W + Jumpthrow (Avancer + Sauter)</option>
            <option value="D + Jumpthrow">D + Jumpthrow</option>
            <option value="Run-throw">Run-throw (Courir et lâcher)</option>
            <option value="Walk-throw">Walk-throw (Marcher shift et lâcher)</option>
          </select>
        </div>

        <div>
          <label class="block text-zinc-400 mb-1 font-semibold">Cible / Zone visée</label>
          <input type="text" id="formTarget" required placeholder="ex: Fenêtre Mid, Stairs, Banane" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:outline-none focus:border-amber-500">
        </div>

        <div>
          <label class="block text-zinc-400 mb-1 font-semibold">Position du joueur (depuis où ?)</label>
          <input type="text" id="formFrom" required placeholder="ex: Spawn T (Poubelle), Coin B" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:outline-none focus:border-amber-500">
        </div>

        <!-- UPLOAD IMAGES DEPUIS LE PC -->
        <div class="border border-zinc-800 bg-zinc-950/60 p-3 rounded-xl space-y-2.5">
          <div>
            <label class="block text-amber-400 font-bold mb-1">📸 Photo du Viseur (Alignement)</label>
            <input type="file" id="fileAim" accept="image/*" required class="block w-full text-zinc-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700">
          </div>
          <div>
            <label class="block text-zinc-400 font-medium mb-1">📍 Photo du Placement (Pieds / Position) - Optionnel</label>
            <input type="file" id="filePos" accept="image/*" class="block w-full text-zinc-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-zinc-200 hover:file:bg-zinc-700">
          </div>
        </div>

        <div>
          <label class="block text-zinc-400 mb-1 font-semibold">Note / Astuce (Optionnel)</label>
          <input type="text" id="formTip" placeholder="ex: Aligner le bas du viseur avec l'antenne" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-zinc-100 focus:outline-none focus:border-amber-500">
        </div>

        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-3 rounded-lg text-sm transition mt-2">
          Enregistrer le Lineup & Exporter
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL 2 : TÉLÉCHARGEMENT & INSTRUCTIONS GITHUB -->
  <div id="exportModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm p-4 overflow-y-auto hidden">
    <div class="max-w-md mx-auto bg-zinc-900 border border-zinc-700 rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="text-center">
        <div class="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto text-xl mb-2">
          <i class="fa-solid fa-check"></i>
        </div>
        <h2 class="text-base font-bold text-zinc-100">Lineup ajouté avec succès !</h2>
        <p class="text-xs text-zinc-400 mt-1">Voici ce qu'il te reste à faire pour mettre à jour GitHub :</p>
      </div>

      <!-- Étape 1 : Téléchargement des photos renommées -->
      <div class="bg-zinc-950 p-3.5 rounded-xl border border-zinc-800 space-y-2">
        <p class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
          <span class="w-4 h-4 rounded-full bg-amber-500 text-zinc-950 text-[10px] inline-flex items-center justify-center font-black">1</span>
          Télécharge tes photos renommées
        </p>
        <p class="text-[11px] text-zinc-400">À déposer dans le dossier <code class="text-zinc-200 bg-zinc-800 px-1 py-0.5 rounded">images/</code> de ton projet :</p>
        <div id="downloadButtonsPhotos" class="space-y-1.5 pt-1">
          <!-- Boutons générés en JS -->
        </div>
      </div>

      <!-- Étape 2 : Téléchargement du HTML -->
      <div class="bg-zinc-950 p-3.5 rounded-xl border border-zinc-800 space-y-2">
        <p class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
          <span class="w-4 h-4 rounded-full bg-amber-500 text-zinc-950 text-[10px] inline-flex items-center justify-center font-black">2</span>
          Télécharge le code du site
        </p>
        <p class="text-[11px] text-zinc-400">Remplace ton ancien fichier <code class="text-zinc-200 bg-zinc-800 px-1 py-0.5 rounded">index.html</code> par celui-ci :</p>
        <button onclick="downloadUpdatedHtml()" class="w-full bg-zinc-100 hover:bg-white text-zinc-950 font-bold py-2.5 rounded-lg text-xs transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-file-code"></i> Télécharger index.html
        </button>
      </div>

      <button onclick="closeExportModal()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-semibold py-2 rounded-lg text-xs transition">
        Terminer
      </button>
    </div>
  </div>

  <!-- MODAL ZOOM IMAGE -->
  <div id="imageModal" class="fixed inset-0 z-50 bg-black/95 flex flex-col justify-center items-center p-2 hidden" onclick="closeImageModal()">
    <img id="modalImage" class="max-w-full max-h-[85vh] object-contain rounded" src="" alt="Zoom">
    <p id="modalCaption" class="text-xs text-zinc-400 mt-3 text-center"></p>
    <button class="absolute top-4 right-4 text-zinc-400 text-2xl px-3 py-1 bg-zinc-900/80 rounded-full">&times;</button>
  </div>

  <!-- ======================================================== -->
  <!-- BASE DE DONNÉES EMBARQUÉE (mise à jour auto par l'export) -->
  <!-- ======================================================== -->
  <script id="database-script">
    window.LINEUPS_DATA = [
      {
        id: "mirage_t_smoke_fenetre_mid",
        map: "Mirage",
        side: "T",
        type: "smoke",
        target: "Fenêtre Mid",
        from: "Spawn T (Poubelle)",
        throwClick: "Clic Gauche",
        throwMovement: "D + Jumpthrow",
        aimImage: "images/mirage_t_smoke_fenetre_mid_aim.jpg",
        posImage: "",
        tip: "Se caler contre la poubelle, viser le coin supérieur droit du tapis."
      }
    ];
  </script>

  <!-- LOGIQUE DE L'APPLICATION -->
  <script>
    let lineups = [...window.LINEUPS_DATA];
    const MAPS = ["Mirage", "Inferno", "Nuke", "Dust II", "Ancient", "Anubis"];

    let currentMap = "Mirage";
    let currentSide = "ALL";
    let currentType = "ALL";

    // Variables temporaires pour l'export
    let lastAimFile = null;
    let lastPosFile = null;
    let lastAimName = "";
    let lastPosName = "";

    function init() {
      renderMapButtons();
      renderLineups();
    }

    function renderMapButtons() {
      const container = document.getElementById("mapButtons");
      container.innerHTML = MAPS.map(map => `
        <button onclick="setMap('${map}')" class="px-3.5 py-1.5 rounded-lg border transition whitespace-nowrap ${currentMap === map ? 'bg-zinc-100 text-zinc-950 border-white' : 'bg-zinc-900 text-zinc-400 border-zinc-800'}">
          ${map}
        </button>
      `).join('');
    }

    function setMap(map) {
      currentMap = map;
      renderMapButtons();
      renderLineups();
    }

    function setSide(side) {
      currentSide = side;
      ['ALL', 'T', 'CT'].forEach(s => {
        const btn = document.getElementById(`btn-side-${s}`);
        btn.className = s === side 
          ? "py-2 rounded-lg bg-amber-500 text-zinc-950 font-bold transition" 
          : "py-2 rounded-lg bg-zinc-900 text-zinc-400 border border-zinc-800 transition";
      });
      renderLineups();
    }

    function setType(type) {
      currentType = type;
      ['ALL', 'smoke', 'molotov', 'flash'].forEach(t => {
        const btn = document.getElementById(`btn-type-${t}`);
        btn.className = t === type 
          ? "px-3 py-1.5 rounded-full bg-zinc-100 text-zinc-950 font-semibold whitespace-nowrap text-xs" 
          : "px-3 py-1.5 rounded-full bg-zinc-900 text-zinc-400 border border-zinc-800 whitespace-nowrap text-xs";
      });
      renderLineups();
    }

    function renderLineups() {
      const container = document.getElementById("lineupsList");
      const filtered = lineups.filter(item => {
        const matchMap = item.map === currentMap;
        const matchSide = currentSide === 'ALL' || item.side === currentSide;
        const matchType = currentType === 'ALL' || item.type === currentType;
        return matchMap && matchSide && matchType;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 text-zinc-600">
            <i class="fa-solid fa-ghost text-4xl mb-3"></i>
            <p class="text-sm">Aucun repère pour ces filtres.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="bg-zinc-900 border border-zinc-800 rounded-xl overflow-hidden shadow-lg">
          <div class="p-3.5 border-b border-zinc-800/80 flex items-start justify-between">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs px-2 py-0.5 rounded font-bold ${item.side === 'T' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-sky-500/20 text-sky-400 border border-sky-500/30'}">
                  ${item.side}
                </span>
                <h3 class="font-bold text-sm tracking-wide text-zinc-100">${item.target}</h3>
              </div>
              <p class="text-xs text-zinc-400 mt-1"><i class="fa-solid fa-location-dot text-zinc-500 mr-1"></i> Depuis : <span class="text-zinc-300">${item.from}</span></p>
            </div>
            
            <div class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-300">
              ${item.type === 'smoke' ? '<i class="fa-solid fa-smog"></i>' : ''}
              ${item.type === 'molotov' ? '<i class="fa-solid fa-fire text-amber-500"></i>' : ''}
              ${item.type === 'flash' ? '<i class="fa-solid fa-bolt text-yellow-400"></i>' : ''}
              ${item.type === 'he' ? '<i class="fa-solid fa-bomb text-red-500"></i>' : ''}
            </div>
          </div>

          <!-- Image Viseur -->
          <div class="relative bg-zinc-950 aspect-video overflow-hidden cursor-pointer" onclick="openImageModal('${item.aimImage}', '${item.target} - Alignement Viseur')">
            <img src="${item.aimImage}" onerror="this.src='https://placehold.co/800x450/18181b/a1a1aa?text=Image+introuvable+(verifiez+images/)'" class="w-full h-full object-cover" alt="Alignement">
            <span class="absolute bottom-2 left-2 bg-black/75 backdrop-blur text-[11px] px-2 py-0.5 rounded text-zinc-300 border border-zinc-700">
              <i class="fa-solid fa-crosshairs mr-1"></i> Viseur (toucher pour zoom)
            </span>
          </div>

          <!-- Badges de lancer -->
          <div class="p-3 bg-zinc-900/60 flex flex-wrap gap-2 items-center text-xs">
            <span class="px-2.5 py-1 rounded bg-zinc-800 text-zinc-200 font-semibold border border-zinc-700 flex items-center gap-1.5">
              <i class="fa-regular fa-hand-pointer text-amber-400"></i> ${item.throwClick}
            </span>
            <span class="px-2.5 py-1 rounded bg-zinc-800 text-zinc-200 font-semibold border border-zinc-700 flex items-center gap-1.5">
              <i class="fa-solid fa-person-running text-sky-400"></i> ${item.throwMovement}
            </span>
            ${item.posImage ? `
              <button onclick="openImageModal('${item.posImage}', '${item.target} - Position')" class="px-2.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 flex items-center gap-1.5 ml-auto">
                <i class="fa-solid fa-shoe-prints text-zinc-400"></i> Position
              </button>
            ` : ''}
          </div>

          ${item.tip ? `
            <div class="px-3 pb-3 text-[11px] text-zinc-400 italic">
              <i class="fa-solid fa-circle-info mr-1 text-zinc-500"></i> ${item.tip}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    // GESTION DU FORMULAIRE ET GÉNÉRATION DES NOMS
    function slugify(text) {
      return text.toString().toLowerCase().trim()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]+/g, '_')
        .replace(/^_+|_+$/g, '');
    }

    function handleFormSubmit(e) {
      e.preventDefault();

      const map = document.getElementById("formMap").value;
      const side = document.getElementById("formSide").value;
      const type = document.getElementById("formType").value;
      const target = document.getElementById("formTarget").value;
      const from = document.getElementById("formFrom").value;
      const throwClick = document.getElementById("formClick").value;
      const throwMovement = document.getElementById("formMovement").value;
      const tip = document.getElementById("formTip").value;

      lastAimFile = document.getElementById("fileAim").files[0];
      lastPosFile = document.getElementById("filePos").files[0];

      // Formatage du nom automatique : ex: mirage_t_smoke_fenetre_aim.jpg
      const baseSlug = `${slugify(map)}_${slugify(side)}_${slugify(type)}_${slugify(target)}`;
      const aimExt = lastAimFile ? lastAimFile.name.split('.').pop() : 'jpg';
      lastAimName = `${baseSlug}_aim.${aimExt}`;

      let posPath = "";
      if (lastPosFile) {
        const posExt = lastPosFile.name.split('.').pop();
        lastPosName = `${baseSlug}_pos.${posExt}`;
        posPath = `images/${lastPosName}`;
      }

      const newEntry = {
        id: baseSlug + "_" + Date.now().toString().slice(-4),
        map,
        side,
        type,
        target,
        from,
        throwClick,
        throwMovement,
        aimImage: `images/${lastAimName}`,
        posImage: posPath,
        tip
      };

      lineups.unshift(newEntry);
      currentMap = map;
      renderMapButtons();
      renderLineups();

      closeAddModal();
      document.getElementById("lineupForm").reset();

      // Préparation du modal d'exportation
      showExportModal();
    }

    function showExportModal() {
      const container = document.getElementById("downloadButtonsPhotos");
      let html = `
        <div class="flex items-center justify-between bg-zinc-900 p-2 rounded border border-zinc-800">
          <span class="font-mono text-zinc-300 text-[11px] truncate mr-2">${lastAimName}</span>
          <button onclick="downloadFile(lastAimFile, lastAimName)" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold px-2 py-1 rounded text-[11px] whitespace-nowrap">
            <i class="fa-solid fa-download"></i> Télécharger
          </button>
        </div>
      `;

      if (lastPosFile) {
        html += `
          <div class="flex items-center justify-between bg-zinc-900 p-2 rounded border border-zinc-800 mt-1">
            <span class="font-mono text-zinc-300 text-[11px] truncate mr-2">${lastPosName}</span>
            <button onclick="downloadFile(lastPosFile, lastPosName)" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold px-2 py-1 rounded text-[11px] whitespace-nowrap">
              <i class="fa-solid fa-download"></i> Télécharger
            </button>
          </div>
        `;
      }

      container.innerHTML = html;
      document.getElementById("exportModal").classList.remove("hidden");
    }

    function downloadFile(file, filename) {
      if (!file) return;
      const url = URL.createObjectURL(file);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // EXPORTATION DU CODE HTML COMPLET ET À JOUR
    function downloadUpdatedHtml() {
      // Cloner tout le document actuel
      const docClone = document.documentElement.cloneNode(true);

      // Fermer tous les modals dans la version exportée
      docClone.querySelector('#addModal').classList.add('hidden');
      docClone.querySelector('#exportModal').classList.add('hidden');
      docClone.querySelector('#imageModal').classList.add('hidden');

      // Injecter la liste à jour dans le script de base de données
      const dbScript = docClone.querySelector('#database-script');
      dbScript.textContent = `\n    window.LINEUPS_DATA = ${JSON.stringify(lineups, null, 2)};\n  `;

      const fullHtml = "<!DOCTYPE html>\n" + docClone.outerHTML;

      const blob = new Blob([fullHtml], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "index.html";
      a.click();
      URL.revokeObjectURL(url);
    }

    // MODALS CONTROLS
    function openAddModal() { document.getElementById("addModal").classList.remove("hidden"); }
    function closeAddModal() { document.getElementById("addModal").classList.add("hidden"); }
    function closeExportModal() { document.getElementById("exportModal").classList.add("hidden"); }

    function openImageModal(src, caption) {
      document.getElementById('modalImage').src = src;
      document.getElementById('modalCaption').innerText = caption;
      document.getElementById('imageModal').classList.remove('hidden');
    }
    function closeImageModal() {
      document.getElementById('imageModal').classList.add('hidden');
    }

    init();
  </script>
</body>
</html>

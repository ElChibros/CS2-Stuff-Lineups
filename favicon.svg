<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dégradé de fond sombre CS2 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Halo lumineux orange CS2 -->
    <filter id="csGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Fond arrondi façon icône d'application -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="16" />

  <!-- Anneau radar tactique -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#f59e0b" stroke-width="12" stroke-dasharray="50 30" opacity="0.35" />

  <!-- Les 4 barres du Crosshair CS2 (lumineuses) -->
  <line x1="256" y1="60" x2="256" y2="135" stroke="#f59e0b" stroke-width="22" stroke-linecap="round" filter="url(#csGlow)" />
  <line x1="256" y1="377" x2="256" y2="452" stroke="#f59e0b" stroke-width="22" stroke-linecap="round" filter="url(#csGlow)" />
  <line x1="60" y1="256" x2="135" y2="256" stroke="#f59e0b" stroke-width="22" stroke-linecap="round" filter="url(#csGlow)" />
  <line x1="377" y1="256" x2="452" y2="256" stroke="#f59e0b" stroke-width="22" stroke-linecap="round" filter="url(#csGlow)" />

  <!-- Corps de la Smoke Grenade -->
  <rect x="196" y="180" width="120" height="152" rx="28" fill="#27272a" stroke="#f59e0b" stroke-width="16" />
  
  <!-- Tête et goupille de la grenade -->
  <rect x="226" y="142" width="60" height="38" rx="8" fill="#f59e0b" />
  <circle cx="218" cy="136" r="18" fill="none" stroke="#f59e0b" stroke-width="10" />

  <!-- Ligne de détail centrale -->
  <line x1="196" y1="256" x2="316" y2="256" stroke="#f59e0b" stroke-width="10" stroke-dasharray="12 10" />

  <!-- Point central du réticule -->
  <circle cx="256" cy="256" r="14" fill="#f59e0b" filter="url(#csGlow)" />
</svg>